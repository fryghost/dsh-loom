name: 功能建议
description: 提出一个改动。请先说明它解决什么问题，再说明它长什么样。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        功能建议里最有用的部分通常是**问题的描述**，而不是方案。Loom 的很多设计（预检、失联成员保留、冲突必须报告）都来自一个具体卡住过的场景，而不是"这样更完整"。

        如果这条建议推翻了 `docs/design.md` 里的某个决策，请把那一节指出来并说明为什么。那篇文档专门记录被否决的方案——比结论更有价值——所以推翻它需要理由。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在卡在哪里、你得用什么绕法、代价是什么。尽量给一个真实场景（几个文件夹、哪些技能、什么会话）。
      placeholder: |
        例：项目里两个文件夹各有一份 AGENTS.md，预检把它们并列列出来，但会话实际只用活动文件夹那份。我得手动对比两份文件……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望它变成什么样。如果和现有的某个不变量（见下一项）有取舍，把取舍一并写出来。
      placeholder: |
        例：预检里为每份指令文件标出"是否参与本次会话"，并把两份文件的差异位置列出来。
    validations:
      required: true

  - type: dropdown
    id: invariant
    attributes:
      label: 这个改动会不会动到「Loom 永不修改 Workspace」这条不变量
      description: |
        不变量是：Loom 只分组已有的 DSH Workspace，永不修改它们。文件夹不被任何项目"拥有"，一个文件夹可以同时属于任意多个项目，项目之间没有主副之分，清单里没有 `claimed` 之类的独占集合。

        选"会改变"不等于这条建议不会被采纳——它意味着需要先把理由讲清楚，因为这条约束正是 Loom 与"独占式项目分组"的分界。
      options:
        - 不改变
        - 会改变
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
      description: 试过或用排除法想过的方案，以及为什么不行。这一项可选，但写了的建议通常推进得更快。
    validations:
      required: false